services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Defaults here intentionally use mocks -- `docker compose up` on a
      # clean clone works with zero credentials (requirement #11).
      # Override via a real .env file (not committed) to use real providers.
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-mock}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - ./testdata:/app/testdata:ro
